version: 1
applications:
  - appRoot: apps/studio
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: apps/studio/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/studio/.next/cache/**/*
